[project]
name = "kenya-mcp"
version = "0.1.0"
description = "MCP server for Kenya government public data (KenyaAPI, KNBS, and other official sources)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
